<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications | Radiant Mind</title>
  <link rel="icon" href="brain-logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--nav-->
  <div id="nav-placeholder"></div>
  <script src="navbar.js"></script>

  <main>
    <!--header-->
    <div class="notif-header">
      <h1>Notifications <span class="badge" id="unread-badge" hidden></span></h1>
      <button class="link-btn" id="mark-all">Mark all as read</button>
    </div>

    <!--tabs-->
    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="queue">Queue updates</button>
      <button class="tab" data-filter="status">Status changes</button>
    </div>

    <!--list (loaded from the backend)-->
    <ul class="notif-list" id="notif-list">
      <li class="empty">Loading notifications…</li>
    </ul>

    <!--demo: sends queue events to the backend, which decides what notifications to create-->
    <div class="demo">
      <span>Demo:</span>
      <button class="btn-small" id="sim-queue">Simulate joining a queue</button>
      <button class="btn-small" id="sim-move">Simulate moving up</button>
      <button class="btn-small" id="sim-status">Simulate being served</button>
      <button class="link-btn" id="reset">Reset</button>
      <span id="demo-status" style="flex-basis: 100%;"></span>
    </div>

    <!--form-->
    <section class="settings">
      <h2>Notification settings</h2>
      <form id="prefs-form" novalidate>
        <fieldset>
          <legend>Notify me about</legend>
          <label class="check"><input type="checkbox" id="pref-queue" /> Queue updates</label>
          <label class="check"><input type="checkbox" id="pref-status" /> Status changes</label>
          <p class="error" id="types-error"></p>
        </fieldset>

        <label for="pref-spots">Alert me when I'm within this many spots of the front (1&ndash;10)</label>
        <input type="number" id="pref-spots" min="1" max="10" step="1" aria-describedby="spots-error" />
        <p class="error" id="spots-error"></p>

        <label class="check"><input type="checkbox" id="pref-popups" /> Show pop-up alerts</label>

        <button type="submit" class="btn-small">Save settings</button>
        <p class="success" id="prefs-success" hidden>Settings saved.</p>
      </form>
    </section>
  </main>

  <!--popup-->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // All data on this page comes from the C# backend (ClinicApi):
    //   /api/notifications/...   Notification module
    //   /api/queue-events/...    queue events that trigger notifications + history
    const NOTIF_API = "/api/notifications";
    const QUEUE_EVENTS_API = "/api/queue-events";
    const notifUserId = getCurrentUserId();            // from navbar.js
    const notifUserPath = encodeURIComponent(notifUserId || "");

    const listEl = document.getElementById("notif-list");
    const unreadBadge = document.getElementById("unread-badge");
    const demoStatus = document.getElementById("demo-status");
    const labels = { queue: "Queue update", status: "Status change" };

    let notifications = [];
    let currentFilter = "all";
    let prefs = { queueUpdates: true, statusChanges: true, alertWithinSpots: 3, popups: true };

    //api helper
    async function api(url, options = {}) {
      let res;
      try {
        res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
      } catch (e) {
        const err = new Error("Can't reach the backend. Start it with dotnet run and open the site at http://localhost:5083.");
        err.errors = {};
        throw err;
      }
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        const errors = (data && data.errors) || {};
        const err = new Error((data && data.error) || Object.values(errors)[0] || `Request failed (${res.status}).`);
        err.status = res.status;
        err.errors = errors;
        throw err;
      }
      return data;
    }

    //helpers
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function timeAgo(iso) {
      const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (seconds < 60) return "Just now";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} min ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hr ago`;
      return new Date(iso).toLocaleDateString();
    }

    //render
    function render(unread) {
      if (notifications.length === 0) {
        listEl.innerHTML = '<li class="empty">No notifications here yet. Try the demo buttons below.</li>';
      } else {
        listEl.innerHTML = notifications.map(n => `
          <li class="notif ${n.read ? "" : "unread"}" data-id="${n.id}">
            <span class="dot"></span>
            <div>
              <span class="tag ${n.type}">${labels[n.type] || n.type}</span>
              <p class="notif-title">${escapeHtml(n.title)}</p>
              <p class="notif-text">${escapeHtml(n.message)}</p>
            </div>
            <span class="notif-time">${timeAgo(n.createdAt)}</span>
          </li>`).join("");
      }

      unreadBadge.textContent = unread;
      unreadBadge.hidden = unread === 0;
    }

    //load
    async function refresh() {
      if (!notifUserId) return;
      try {
        notifications = await api(`${NOTIF_API}/${notifUserPath}?type=${currentFilter}`);
        const { count } = await api(`${NOTIF_API}/${notifUserPath}/unread-count`);
        render(count);
      } catch (e) {
        listEl.innerHTML = `<li class="empty">${escapeHtml(e.message)}</li>`;
      }
      updateNavBadge();
    }

    //read one
    listEl.addEventListener("click", async e => {
      const item = e.target.closest(".notif");
      if (!item) return;
      try {
        await api(`${NOTIF_API}/${notifUserPath}/${item.dataset.id}/read`, { method: "POST" });
      } catch (err) {
        showToast("Error", err.message, true);
      }
      refresh();
    });

    //read all
    document.getElementById("mark-all").addEventListener("click", async () => {
      try {
        await api(`${NOTIF_API}/${notifUserPath}/read-all`, { method: "POST" });
      } catch (err) {
        showToast("Error", err.message, true);
      }
      refresh();
    });

    //tabs
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        refresh();
      });
    });

    //popup
    let toastTimer;
    function showToast(label, title, always = false) {
      if (!prefs.popups && !always) return;
      const toast = document.getElementById("toast");
      toast.innerHTML = `<strong>${escapeHtml(label)}</strong><br>${escapeHtml(title)}`;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 4000);
    }

    function announce(list) {
      const newest = list.filter(Boolean).pop();
      if (newest) showToast(labels[newest.type] || "Notification", newest.title);
    }

    //demo
    const demoServices = ["Psychiatric Walk-In Evaluation", "Medication Management & Review", "Urgent Consult"];
    let demoVisit = null;   // { serviceName, position }

    function postEvent(path, body) {
      return api(`${QUEUE_EVENTS_API}/${path}`, { method: "POST", body: JSON.stringify({ userId: notifUserId, ...body }) });
    }

    async function runDemo(action) {
      try {
        if (action === "join") {
          if (demoVisit) throw new Error(`You're already in the queue for ${demoVisit.serviceName}.`);
          const serviceName = demoServices[Math.floor(Math.random() * demoServices.length)];
          const position = Math.floor(Math.random() * 4) + 4;   // #4 to #7
          const result = await postEvent("joined", { serviceName, position, estimatedWaitMinutes: position * 15 });
          demoVisit = { serviceName, position };
          demoStatus.textContent = `Joined ${serviceName} at #${position}. Click "Simulate moving up" to get closer to the front.`;
          announce(result.notifications);
        } else if (action === "move") {
          if (!demoVisit) throw new Error("Join a queue first.");
          if (demoVisit.position === 1) throw new Error("You're already first in line. Try \"Simulate being served\".");
          demoVisit.position--;
          const result = await postEvent("position", { serviceName: demoVisit.serviceName, position: demoVisit.position });
          demoStatus.textContent = result.notification
            ? `Now #${demoVisit.position}: within your alert range, so the backend sent a notification.`
            : `Now #${demoVisit.position}: outside your alert range of ${prefs.alertWithinSpots}, so no notification yet.`;
          announce([result.notification]);
        } else if (action === "served") {
          if (!demoVisit) throw new Error("Join a queue first.");
          const result = await postEvent("served", { serviceName: demoVisit.serviceName });
          demoStatus.textContent = `Served for ${demoVisit.serviceName}. It now shows as Completed in your History.`;
          demoVisit = null;
          announce([result.notification]);
        }
      } catch (err) {
        demoStatus.textContent = err.message;
      }
      refresh();
    }

    document.getElementById("sim-queue").addEventListener("click", () => runDemo("join"));
    document.getElementById("sim-move").addEventListener("click", () => runDemo("move"));
    document.getElementById("sim-status").addEventListener("click", () => runDemo("served"));

    //reset
    document.getElementById("reset").addEventListener("click", async () => {
      try {
        if (demoVisit) await postEvent("left", { serviceName: demoVisit.serviceName });
        await api(`${NOTIF_API}/${notifUserPath}`, { method: "DELETE" });
        demoStatus.textContent = "Notifications cleared.";
      } catch (err) {
        demoStatus.textContent = err.message;
      }
      demoVisit = null;
      refresh();
    });

    //form
    const form = document.getElementById("prefs-form");
    const queueBox = document.getElementById("pref-queue");
    const statusBox = document.getElementById("pref-status");
    const spotsInput = document.getElementById("pref-spots");
    const popupsBox = document.getElementById("pref-popups");
    const typesError = document.getElementById("types-error");
    const spotsError = document.getElementById("spots-error");
    const successMsg = document.getElementById("prefs-success");

    //fill
    function fillForm() {
      queueBox.checked = prefs.queueUpdates;
      statusBox.checked = prefs.statusChanges;
      spotsInput.value = prefs.alertWithinSpots;
      popupsBox.checked = prefs.popups;
    }

    //error
    function setError(input, errorEl, message) {
      errorEl.textContent = message;
      if (input) {
        input.classList.toggle("invalid", message !== "");
        input.setAttribute("aria-invalid", message !== "");
      }
    }

    //save (the backend validates; its error messages are shown next to the fields)
    form.addEventListener("submit", async e => {
      e.preventDefault();
      successMsg.hidden = true;
      setError(null, typesError, "");
      setError(spotsInput, spotsError, "");

      const raw = spotsInput.value.trim();
      const spots = raw === "" ? null : Number(raw);
      if (spots !== null && !Number.isInteger(spots)) {
        setError(spotsInput, spotsError, "Use a whole number, like 3.");
        return;
      }

      try {
        prefs = await api(`${NOTIF_API}/${notifUserPath}/settings`, {
          method: "PUT",
          body: JSON.stringify({
            queueUpdates: queueBox.checked,
            statusChanges: statusBox.checked,
            alertWithinSpots: spots,
            popups: popupsBox.checked
          })
        });
        fillForm();
        successMsg.hidden = false;
      } catch (err) {
        const errors = err.errors || {};
        setError(null, typesError, errors.types || errors.queueUpdates || errors.statusChanges || "");
        setError(spotsInput, spotsError, errors.alertWithinSpots || "");
        if (!Object.keys(errors).length) setError(null, typesError, err.message);
      }
    });

    //hide saved
    form.addEventListener("input", () => { successMsg.hidden = true; });

    //start
    async function start() {
      if (!notifUserId) return;   // navbar.js sends logged-out visitors to the login page
      try {
        prefs = await api(`${NOTIF_API}/${notifUserPath}/settings`);
      } catch (e) {}
      fillForm();
      refresh();
    }
    start();
  </script>
</body>
</html>
