

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Radiant Mind</title>
  <link rel="icon" href="brain-logo.png" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <!-- Navigation Bar (built by navbar.js, same on every page) -->
  <div id="nav-placeholder"></div>
  <script src="navbar.js"></script>
 
  <main>
    <div class="auth-container">
      <h2>Patient Login</h2>
      <p class="subtitle">Access your clinic records and services</p>
 
      <div id="login-alert" class="alert-box alert-success">
        Login successful! Redirecting...
      </div>
 
      <form id="login-form" novalidate>
        <!-- Email / Username -->
        <div class="form-group">
          <label for="email">Email Address (Username)</label>
          <input type="email" id="email" placeholder="example@domain.com" required>
          <span class="error-message" id="email-error"></span>
        </div>
 
        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
          <span class="error-message" id="password-error"></span>
        </div>
 
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>
 
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>
 
  <footer>
    <p>&copy; 2026 Walk-In Psychiatric Clinic. All rights reserved.</p>
  </footer>
 
  <!-- Login logic + dummy data (this is what the unit tests cover) -->
  <script src="authentication.js"></script>
 
  <script>
    const loginForm = document.getElementById('login-form');
    const loginEmail = document.getElementById('email');
    const loginPassword = document.getElementById('password');
    const loginEmailError = document.getElementById('email-error');
    const loginPasswordError = document.getElementById('password-error');
    const loginAlert = document.getElementById('login-alert');
 
    function showFieldError(input, errorEl, msg) {
      if (msg) {
        input.classList.add('invalid');
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      } else {
        input.classList.remove('invalid');
        errorEl.style.display = 'none';
      }
    }
 
    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
 
      const result = loginUser(loginEmail.value, loginPassword.value);   // from auth.js
 
      if (result.ok) {
        showFieldError(loginEmail, loginEmailError, '');
        showFieldError(loginPassword, loginPasswordError, '');
        loginAlert.textContent = `Welcome, ${result.user.name}! Redirecting...`;
        loginAlert.style.display = 'block';
        setTimeout(() => { window.location.href = 'joinQueue.html'; }, 1500);
        return;
      }
 
      const errors = result.errors;
      showFieldError(loginEmail, loginEmailError, errors.email || '');
      showFieldError(loginPassword, loginPasswordError, errors.password || errors.form || '');
    });
  </script>
 
</body>
</html>
