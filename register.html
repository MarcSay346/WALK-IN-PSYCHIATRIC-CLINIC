<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Radiant Mind</title>
  <link rel="icon" href="brain-logo.png" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar (built by navbar.js, same on every page) -->
  <div id="nav-placeholder"></div>
  <script src="navbar.js"></script>

  <main>
    <div class="auth-container">
      <h2>Create Account</h2>
      <p class="subtitle">Register to manage your walk-in intake &amp; profile</p>

      <div id="register-alert" class="alert-box alert-success">
        Account successfully created! Redirecting to login...
      </div>

      <form id="register-form" novalidate>
        <!-- Email (Used as Username) -->
        <div class="form-group">
          <label for="reg-email">Email Address (Username)</label>
          <input type="email" id="reg-email" placeholder="example@domain.com" required>
          <span class="error-message" id="reg-email-error"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="At least 6 characters" required>
          <span class="error-message" id="reg-password-error"></span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter your password" required>
          <span class="error-message" id="confirm-password-error"></span>
        </div>

        <button type="submit" class="btn btn-secondary btn-full">Register Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Walk-In Psychiatric Clinic. All rights reserved.</p>
  </footer>

  <!-- Registration logic + dummy data (this is what the unit tests cover) -->
  <script src="auth.js"></script>

  <script>
    const regForm = document.getElementById('register-form');
    const regEmail = document.getElementById('reg-email');
    const regPassword = document.getElementById('reg-password');
    const regConfirm = document.getElementById('confirm-password');
    const regEmailError = document.getElementById('reg-email-error');
    const regPasswordError = document.getElementById('reg-password-error');
    const regConfirmError = document.getElementById('confirm-password-error');
    const registerAlert = document.getElementById('register-alert');

    function showFieldError(input, errorEl, msg) {
      if (msg) {
        input.classList.add('invalid');
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      } else {
        input.classList.remove('invalid');
        errorEl.style.display = 'none';
      }
    }

    regForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const result = registerUser({                 // from auth.js
        email: regEmail.value,
        password: regPassword.value,
        confirmPassword: regConfirm.value
      });

      const errors = result.errors || {};
      showFieldError(regEmail, regEmailError, errors.email || '');
      showFieldError(regPassword, regPasswordError, errors.password || '');
      showFieldError(regConfirm, regConfirmError, errors.confirmPassword || '');

      if (result.ok) {
        registerAlert.style.display = 'block';
        regForm.reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      }
    });
  </script>

</body>
</html>
